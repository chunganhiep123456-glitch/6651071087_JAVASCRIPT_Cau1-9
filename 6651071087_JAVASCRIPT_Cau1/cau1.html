<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>JS DOM paragraph style</title>
<link rel="stylesheet" href="Styles/cau1.css">
</head>
<body>
<p id="text">JavaScript Exercises - w3resource</p>
<div class="controls">
  <label>Font size (px): <input type="number" id="fontSize" value="24" min="8" max="100"></label>
  <label>Font family:
    <select id="fontFamily">
      <option>Arial</option><option>Times New Roman</option><option>Courier New</option>
      <option>Verdana</option><option>Tahoma</option>
    </select>
  </label>
  <label>Color: <input type="color" id="color" value="#ff0000"></label>
  <button id="jsstyle">Submit</button>
</div>
<script src="Scripts/jquery-3.7.1.min.js"></script>
<script>window.jQuery||document.write(unescape("%3Cscript src=%22https://code.jquery.com/jquery-3.7.1.min.js%22%3E%3C/script%3E"))</script>
<script src="Scripts/cau1.js"></script>
</body>
</html>
