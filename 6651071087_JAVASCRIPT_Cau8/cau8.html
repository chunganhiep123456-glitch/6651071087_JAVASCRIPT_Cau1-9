<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Máy tính đơn giản</title>
<link rel="stylesheet" href="Styles/cau8.css">
</head>
<body>
<div class="calc">
  <input type="text" id="num1" value="12">
  <button class="op" data-op="+">+</button>
  <button class="op" data-op="-">-</button>
  <button class="op" data-op="*">x</button>
  <button class="op" data-op="/">/</button>
  <button class="op" data-op="^">^</button>
  <input type="text" id="num2" value="14">
  <span>=</span>
  <input type="text" id="result" readonly>
</div>
